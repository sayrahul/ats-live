<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ATS Live">
<title>ATS Live</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#0f172a;--muted:#5b6779;--line:#e5e7eb;--soft:#f1f5f9;--on:#0f172a;--onText:#fff;
  --pass:#15803d;--passBg:#dcfce7;--fail:#b91c1c;--failBg:#fee2e2;--hold:#6d28d9;--holdBg:#ede9fe;
  --pend:#b45309;--pendBg:#fef3c7;--unp:#0369a1;--unpBg:#e0f2fe;--brand:#16a34a;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html.dark{
  --bg:#0b0f14;--card:#141a21;--text:#e5e7eb;--muted:#9aa7b8;--line:#232b35;--soft:#1b222b;--on:#e5e7eb;--onText:#0b0f14;
  --pass:#4ade80;--passBg:rgba(34,197,94,.16);--fail:#f87171;--failBg:rgba(239,68,68,.17);--hold:#a78bfa;--holdBg:rgba(139,92,246,.18);
  --pend:#fbbf24;--pendBg:rgba(245,158,11,.16);--unp:#38bdf8;--unpBg:rgba(14,165,233,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(16px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono);font-weight:700;letter-spacing:.2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 8px}
.bar{display:flex;align-items:center;gap:10px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:16px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex:none}
.dot.old{background:#f59e0b}.dot.off{background:#ef4444}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ib svg{width:18px;height:18px}
.ib:active{transform:scale(.96)}
.days{display:flex;gap:6px;margin-top:12px;align-items:center}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600}
.chip.on{background:var(--on);border-color:var(--on);color:var(--onText)}
.cal{position:relative;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.cal svg{width:16px;height:16px;color:var(--muted)}
.cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cal input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;background:var(--soft);border-radius:12px;padding:3px;margin-top:10px}
.tabs button{height:36px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.12)}
.tabs button span{color:var(--muted);font-weight:600}
.dsc{font-size:11px;font-weight:700;white-space:nowrap;flex:none}.dsc.ok{color:var(--pass)}.dsc.no{color:#be185d}
html.dark .dsc.no{color:#f9a8d4}
.vo{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:4px 9px}
.btiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btile{border-radius:12px;padding:9px 4px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.btile b{font-size:20px;font-variant-numeric:tabular-nums}.btile span{font-size:11.5px;font-weight:600;color:var(--muted)}
.btile{border:1.5px solid transparent}.btile.on{border-color:currentColor}
.btile.vt{border:1px dashed var(--line)}.btile.vt.on{border:1.5px solid currentColor}.btile small{font-size:10.5px;color:var(--muted)}
.voidl{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px dashed var(--line);border-radius:12px;font-size:13px;color:var(--muted)}
.voidl i{width:8px;height:8px;border-radius:50%;background:#94a3b8}.voidl b{color:var(--text)}
.row:disabled{color:inherit;cursor:default}
.row.void{opacity:.55}.row.void .mono{text-decoration:line-through}
.b-ok{color:var(--pass);background:var(--passBg)}.b-new{color:var(--pend);background:var(--pendBg)}.b-unp{color:var(--unp);background:var(--unpBg)}.b-void{color:var(--muted);background:var(--soft)}.b-other{color:var(--hold);background:var(--holdBg)}
.ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted);transition:height .2s}
.ptr .sp{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%}
.ptr.go .sp{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nudge{display:flex;align-items:center;gap:10px;margin:4px 16px 0;padding:10px 12px;border-radius:14px;background:var(--passBg);color:var(--pass);font-size:13px;font-weight:600}
.nudge span{flex:1}.nudge .go{border:none;background:var(--brand);color:#fff;border-radius:10px;height:34px;padding:0 12px;font-weight:700}
.nudge .x{border:none;background:none;color:inherit;font-size:20px;width:30px;height:34px}
.offline{margin:4px 16px 0;padding:8px 12px;border-radius:12px;background:var(--pendBg);color:var(--pend);font-size:12.5px;font-weight:600;text-align:center}
.sum{margin:6px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:34px;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{border:1.5px solid transparent;border-radius:12px;padding:9px 4px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile b{font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;font-weight:600;color:var(--muted)}
.tile.on{border-color:currentColor}
.t-PASS{background:var(--passBg);color:var(--pass)}.t-FAIL{background:var(--failBg);color:var(--fail)}.t-HOLD{background:var(--holdBg);color:var(--hold)}.t-PEND{background:var(--pendBg);color:var(--pend)}
.unpl{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:transparent;font-size:13px;text-align:left}
.unpl.on{border-color:var(--unp);background:var(--unpBg)}
.unpl i{width:8px;height:8px;border-radius:50%;background:var(--unp)}
.unpl em{font-style:normal;color:var(--muted)}
.unpl .chev{margin-left:auto;color:var(--muted)}
.sec{margin:18px 16px 8px;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.prog{display:flex;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.prog::-webkit-scrollbar{display:none}
.pc{flex:none;width:150px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pc .mono{font-size:13px}
.pc span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pc span i{width:7px;height:7px;border-radius:50%;background:var(--pend)}
.pc.u span i{background:var(--unp)}
.list{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 14px;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;transition:background-color .6s}
.row:last-child{border-bottom:none}
.row:active{background:var(--soft)}
.row.flash{background:var(--pendBg)}
.row .n{width:24px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.row .v{flex:1;min-width:0;display:flex;flex-direction:column}
.row .v .mono{font-size:14.5px}
.row .v small{font-size:11.5px;color:var(--muted);margin-top:1px}
.row .chev{color:var(--muted);font-size:16px}
.pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis;flex:none}
.p-PASS{color:var(--pass);background:var(--passBg)}.p-FAIL{color:var(--fail);background:var(--failBg)}.p-HOLD,.p-ISSUE{color:var(--hold);background:var(--holdBg)}
.p-PENDING,.p-DONE{color:var(--pend);background:var(--pendBg)}.p-UNP{color:var(--unp);background:var(--unpBg)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px}
.sk{height:52px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--soft) 25%,var(--card) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* sub views */
.view{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));animation:in .18s ease-out}
@keyframes in{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}
.vh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 8px}
.vh .h{flex:1;font-size:17px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh .sub{font-size:15px;font-weight:600;color:var(--muted)}
.card{margin:8px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.dhead{display:flex;align-items:center;gap:10px}
.dhead .mono{font-size:22px;flex:1}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.info{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.ir{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;border-top:1px solid var(--line);padding-top:6px;font-size:13.5px}
.ir>span:first-child{color:var(--muted)}
.kv div{background:var(--soft);border-radius:12px;padding:10px 11px}
.kv span{display:block;font-size:11.5px;color:var(--muted)}.kv b{font-size:15px}
.tl{padding:16px 16px 4px}
.it{display:flex;gap:12px;min-height:54px}
.it .rail{display:flex;flex-direction:column;align-items:center;width:14px;flex:none}
.it .b{width:12px;height:12px;border-radius:50%;background:var(--brand);margin-top:3px;flex:none}
.it .b.f{background:#dc2626}.it .b.h{background:#7c3aed}.it .b.w{background:transparent;border:2px solid var(--pend)}
.it .ln{width:2px;flex:1;background:var(--line);margin:3px 0}
.it .x{flex:1;padding-bottom:12px}
.it .x b{display:block;font-size:14px;font-weight:600}.it .x small{font-size:12.5px;color:var(--muted)}
.it .tm{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sbox{flex:1;display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:0 12px;height:44px}
.sbox svg{width:18px;height:18px;color:var(--muted);flex:none}
.sbox input{flex:1;border:none;outline:none;background:transparent;font-size:16px;font-weight:500;min-width:0}
.hint{padding:0 16px 8px;font-size:12.5px;color:var(--muted)}
.hit .d{width:84px;flex:none;display:flex;flex-direction:column}
.hit .d b{font-size:13px;font-weight:600}.hit .d small{font-size:11.5px;color:var(--muted)}
.report{font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--text);max-height:56vh;overflow:auto}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.btn{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:700}
.btn.g{background:#15803d;border-color:#15803d;color:#fff}
.set{padding:0 16px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:none}
.sr .l{font-size:15px;font-weight:500}.sr small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--muted);border-radius:8px;min-width:40px;height:34px;padding:0 11px;font-size:13px;font-weight:600}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.tog{width:50px;height:30px;border:none;border-radius:15px;background:var(--line);position:relative;flex:none;padding:0;transition:background .15s}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--brand)}.tog.on:after{left:23px}
.ver{padding:14px 20px;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--on);color:var(--onText);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:40;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.setup{padding:48px 20px;max-width:480px;margin:0 auto}
.setup h2{font-size:20px;margin:14px 0 6px}.setup p{color:var(--muted);font-size:14px;line-height:1.5}
.setup textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px;font:13px var(--mono);min-height:90px}
.setup .err{color:var(--fail);font-size:13px;margin-top:8px}
.setup .btn{width:100%;margin-top:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="views"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var VERSION = 'v3';
  var CFG_KEY = 'atsLive.cfg', DATA_KEY = 'atsLive.data.', PREF_KEY = 'atsLive.prefs', PUSH_KEY = 'atsLive.push';
  var EVERY = 15000;
  var app = document.getElementById('app'), views = document.getElementById('views');
  var cfg = null, prefs = { theme: 'auto', size: 'M' };
  var S = { bfilter: '', cur: '', today: '', data: null, filter: 'all', err: '', loading: false, sig: '', auto: true, view: null, tab: localStorage.getItem('atsLive.tab') === 'book' ? 'book' : 'veh' };
  var timer = null, ui = {}, rowEls = new Map();

  // ---------- small helpers ----------
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function svg(path, w) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + '</svg>'; }
  var IC = {
    search: svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),
    share: svg('<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>'),
    set: svg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),
    back: svg('<path d="M15 18l-6-6 6-6"/>'),
    cal: svg('<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>')
  };
  var LOGO = '<svg width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="ATS Live"><rect width="64" height="64" rx="15" fill="#16a34a"/><circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="4.5"/><path d="M25 32.5l5 5 9.5-10" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function dmy(k) { var p = k.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function dMon(k) { var p = k.split('-'); return p[2] + ' ' + MON[+p[1] - 1]; }
  function addDays(k, n) { var p = k.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
  function dayName(k) { return k === S.today ? 'Today' : k === addDays(S.today, -1) ? 'Yesterday' : dMon(k); }
  var tf = null;
  function tm(ms) {
    if (!ms) return '';
    try { tf = tf || new Intl.DateTimeFormat('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' }); return tf.format(new Date(ms)).toUpperCase(); }
    catch (e) { return new Date(ms).toTimeString().slice(0, 5); }
  }
  function dur(a, b) { if (!a || !b || b < a) return '—'; var m = Math.round((b - a) / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
  var toastT = null;
  function toast(m, ms) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, ms || 1800); }
  var KL = { PASS: 'PASS', FAIL: 'FAIL', HOLD: 'HOLD', ISSUE: 'HOLD', PENDING: 'Pending', DONE: 'Pending', UNP: 'Unprocessed' };
  function label(r) { return r.kind === 'ISSUE' ? (r.st || 'Issue') : r.kind === 'HOLD' ? (r.st || 'HOLD') : KL[r.kind] || 'Pending'; }
  var STAGE = { ready: 'At Data Ready', pushed: 'Pushed · waiting for Raw', raw: 'At Push Raw', rawpushed: 'Raw pushed · waiting for Test', test: 'At Push Test', done: 'Test data pushed' };
  function isPend(r) { return r.kind === 'PENDING' || r.kind === 'DONE'; }

  // ---------- preferences: theme + text size ----------
  function loadPrefs() { try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) { /* default */ } applyPrefs(); }
  function savePrefs() { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); applyPrefs(); }
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyPrefs() {
    var dark = prefs.theme === 'dark' || (prefs.theme === 'auto' && mq && mq.matches);
    document.documentElement.classList.toggle('dark', !!dark);
    document.body.style.zoom = { S: '0.92', M: '1', L: '1.12' }[prefs.size] || '1';
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', applyPrefs);

  // ---------- config (from the setup link) ----------
  function parseLink(text) {
    try {
      var url = new URL(String(text || '').trim());
      if (!/^script\.google(usercontent)?\.com$/.test(url.hostname)) return null;
      var v = url.searchParams.get('v');
      return v ? { u: url.origin + url.pathname, v: v } : null;
    } catch (e) { return null; }
  }
  function loadCfg() {
    var h = location.hash.replace(/^#/, '');
    if (h) {
      var p = new URLSearchParams(h);
      if (p.get('u') && p.get('v')) { var c = parseLink(p.get('u') + '?v=' + encodeURIComponent(p.get('v'))); if (c) localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
      history.replaceState(null, '', location.pathname + location.search);
    }
    try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { cfg = null; }
  }
  function api(params) {

      function draw() {

        var r = rows.find(function (x) { return x.veh === r0.veh && String(x.n) === String(r0.n); }) || rows.find(function (x) { return x.veh === r0.veh; }) || r0;
        var t = r.t || {};
        body.textContent = '';
        var card = el('div', 'card');
        var hd = el('div', 'dhead'); hd.appendChild(el('span', 'mono', r.veh)); var p = el('span', 'pill p-' + r.kind, label(r)); hd.appendChild(p); card.appendChild(hd);
        var kv = el('div', 'kv');
        var earlier = visits ? visits.filter(function (x) { return x.veh === r.veh && x.date !== S.cur; }) : null;
        [['Serial', '#' + r.n], r.meta && !t.added ? ['Test', r.meta.testType || '—'] : ['Total time', t.result ? dur(t.added, t.result) : (t.added && isPend(r) && S.cur === S.today ? dur(t.added, Date.now()) + ' so far' : '—')], ['Visit', earlier === null ? '…' : earlier.length ? 'Retest' : 'First']].forEach(function (x) {
          var d = el('div'); d.appendChild(el('span', null, x[0])); d.appendChild(el('b', null, x[1])); kv.appendChild(d);
        });
        card.appendChild(kv);
        // booking + DSC
        var bkList = (S.data && S.data.day && S.data.day.bookings) || [];
        var bk = bkList.filter(function (b) { return b.veh === r.veh && !/void|cancel/i.test(b.order); })[0] || bkList.filter(function (b) { return b.veh === r.veh; })[0];
        var info = el('div', 'info');
        var addInfo = function (k, vEl) { var rr = el('div', 'ir'); rr.appendChild(el('span', null, k)); rr.appendChild(vEl); info.appendChild(rr); };
        if (bk) { var bp = el('span', 'pill ' + bClass(bk.order), niceStatus(bk.order)); addInfo('Booking', bp); }
        if (r.dsc) addInfo('DSC', el('span', 'dsc ' + r.dsc, r.dsc === 'ok' ? '✓ Signed report in folder' : '✗ Not signed yet'));
        if (r.meta && r.meta.testNo) addInfo('Test No', el('b', null, r.meta.testNo));
        if (info.children.length) card.appendChild(info);
        body.appendChild(card);
        body.appendChild(el('div', 'sec', 'Timeline'));
        var steps = [];
        if (bk) {
          var btxt = String(bk.time || '').trim();
          if (btxt) steps.push(['Booked', 'Booking Summary', btxt.length > 12 ? btxt.replace(/^\S+\s+/, '') || btxt : btxt, '']);
          else if (bk.seen) steps.push(['Booked', 'First seen on Booking Summary', bk.seen, '']);
        }
        if (t.added) steps.push(['Added to list', '', t.added, '']);
        if (t.pushed) steps.push(['Pushed', 'Data Ready For Production', t.pushed, '']);
        if (t.raw) steps.push(['Raw data pushed', 'Push Raw Data', t.raw, '']);
        if (t.test) steps.push(['Test data pushed', 'Push Test Data', t.test, '']);
        if (r.meta && !t.added) {   // an old day rebuilt from its signed PDF
          var sg = String(r.meta.signedAt || '').split(' ')[1] || '';
          var h12 = sg ? (function (x) { var p = x.split(':'); var h = +p[0]; return (h % 12 || 12) + ':' + p[1] + ' ' + (h < 12 ? 'AM' : 'PM'); })(sg) : '';
          steps.push(['Tested' + (r.meta.testType ? ' · ' + r.meta.testType : ''), r.meta.testNo ? 'Test No ' + r.meta.testNo : '', '', '']);
          steps.push(['Result: ' + r.kind, h12 ? 'Report signed' : 'From the signed report', h12, r.kind === 'FAIL' ? 'f' : '']);
        }
        if (t.result) steps.push(['Result: ' + (r.kind === 'ISSUE' ? 'HOLD' : r.kind), r.kind === 'ISSUE' || r.kind === 'HOLD' ? (r.st || '') : '', t.result, r.kind === 'FAIL' ? 'f' : r.kind === 'PASS' ? '' : 'h']);
        else if (isPend(r)) steps.push(['Now: ' + (STAGE[r.stage] || 'Pending'), 'Work in progress', 0, 'w']);
        var tl = el('div', 'card tl');
        if (!steps.length) tl.appendChild(el('div', 'empty', 'No timing for this day.'));
        steps.forEach(function (s, i) {
          var it = el('div', 'it'); var rail = el('div', 'rail'); rail.appendChild(el('span', 'b ' + s[3])); if (i < steps.length - 1) rail.appendChild(el('span', 'ln'));
          it.appendChild(rail);
          var x = el('div', 'x'); x.appendChild(el('b', null, s[0])); if (s[1]) x.appendChild(el('small', null, s[1])); it.appendChild(x);
          it.appendChild(el('span', 'tm', typeof s[2] === 'string' ? s[2] : tm(s[2]))); tl.appendChild(it);
        });
        body.appendChild(tl);
        body.appendChild(el('div', 'sec', 'Earlier visits'));
        var lst = el('div', 'list');
        if (earlier === null) lst.appendChild(el('div', 'empty', 'Loading…'));
        else if (!earlier.length) lst.appendChild(el('div', 'empty', 'First visit.'));
        else earlier.forEach(function (h) {
          var b = el('button', 'row hit');
          b.innerHTML = '<span class="d"><b></b><small></small></span><span class="v"><span class="mono"></span></span><span class="pill"></span>';
          b.querySelector('.d b').textContent = dMon(h.date);
          b.querySelector('.d small').textContent = '#' + h.n + ' · ' + h.date.slice(0, 4);
          b.querySelector('.mono').textContent = h.veh;
          var pp = b.querySelector('.pill'); pp.className = 'pill p-' + h.kind; pp.textContent = label(h);
          b.onclick = function () { closeView(); goDay(h.date); };
          lst.appendChild(b);
        });
        body.appendChild(lst);
      }
      V.refresh = draw; draw();
      api({ q: r0.veh }).then(function (j) { visits = j.hits || []; if (S.view === V) draw(); }).catch(function () { visits = []; if (S.view === V) draw(); });
    });
  }

  // search in all days
  function openSearch() {
    openView(function (v) {
      var h = vhead(v, '', false); h.removeChild(h.lastChild);
      var box = el('label', 'sbox'); box.innerHTML = IC.search;
      var inp = el('input'); inp.type = 'search'; inp.placeholder = 'Vehicle number, e.g. 4241'; inp.setAttribute('aria-label', 'Search vehicle in all days'); inp.autocomplete = 'off';
      box.appendChild(inp); h.appendChild(box);
      var hint = el('div', 'hint', 'Type at least 3 letters or digits'); v.appendChild(hint);
      var lst = el('div', 'list'); lst.hidden = true; v.appendChild(lst);
      var tmr = null, seq = 0;
      inp.oninput = function () {
        clearTimeout(tmr);
        var q = inp.value.replace(/[^a-z0-9]/gi, '');
        if (q.length < 3) { hint.textContent = 'Type at least 3 letters or digits'; lst.hidden = true; return; }
        hint.textContent = 'Searching…';
        tmr = setTimeout(function () {
          var my = ++seq;
          api({ q: q }).then(function (j) {
            if (my !== seq) return;
            var hits = j.hits || [];
            hint.textContent = hits.length ? hits.length + ' result' + (hits.length > 1 ? 's' : '') + ' · all days' : 'Not found in any day';
            lst.textContent = ''; lst.hidden = !hits.length;
            hits.forEach(function (x) {
              var b = el('button', 'row hit');
              b.innerHTML = '<span class="d"><b></b><small></small></span><span class="v"><span class="mono"></span></span><span class="pill"></span>';
              b.querySelector('.d b').textContent = x.date === S.today ? 'Today' : dMon(x.date);
              b.querySelector('.d small').textContent = '#' + x.n;
              b.querySelector('.mono').textContent = x.veh;
              var p = b.querySelector('.pill'); p.className = 'pill p-' + x.kind; p.textContent = label(x);
              b.onclick = function () {
                closeView(true); history.back();
                var openIt = function () { openDetail({ veh: x.veh, n: x.n, kind: x.kind, st: x.st }); };
                if (x.date === S.cur) setTimeout(openIt, 60); else { goDay(x.date); load(true).then(openIt); }
              };
              lst.appendChild(b);
            });
          }).catch(function () { if (my === seq) hint.textContent = 'No internet'; });
        }, 350);
      };
      setTimeout(function () { inp.focus(); }, 80);
    });
  }

  // day report, same numbers as the notepad
  function reportText() {
    var d = S.data && S.data.day; if (!d) return '';
    var rows = d.rows, c = d.counts, st = (S.data.station || 'ATS Live');
    var line = function (r) { return r.n + '. ' + r.veh + ' – ' + (r.kind === 'PENDING' || r.kind === 'DONE' ? 'Pending' : r.kind === 'ISSUE' ? (r.st || 'Issue') : r.kind === 'HOLD' ? (r.st || 'HOLD') : r.kind); };
    var sec = function (t, list) { return list.length ? ['', '*' + t + ' (' + list.length + ')*'].concat(list.map(line)) : []; };
    var out = ['*' + st + ' – Day Report*', 'Date: ' + dmy(d.date), '*Total ' + c.total + '* · PASS ' + c.pass + ' · FAIL ' + c.fail + ' · HOLD ' + c.hold];
    out = out.concat(sec('FAIL', rows.filter(function (r) { return r.kind === 'FAIL'; })),
      sec('PASS', rows.filter(function (r) { return r.kind === 'PASS'; })),
      sec('HOLD / Issue', rows.filter(function (r) { return r.kind === 'HOLD' || r.kind === 'ISSUE'; })),
      sec('PENDING', rows.filter(isPend)));
    return out.join('\n');
  }
  function openShare() {
    openView(function (v, V) {
      vhead(v, 'Share day report');
      var card = el('div', 'card'); var pre = el('div', 'report'); card.appendChild(pre); v.appendChild(card);
      var bt = el('div', 'btns'); var cp = el('button', 'btn', 'Copy'); var wa = el('button', 'btn g', 'WhatsApp'); bt.appendChild(cp); bt.appendChild(wa); v.appendChild(bt);
      function draw() { pre.textContent = reportText() || 'No data for this day yet.'; }
      V.refresh = draw; draw();
      cp.onclick = function () {
        var t = reportText(); if (!t) return;
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Report copied'); }, function () {
          var ta = el('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Report copied');
        });
      };
      wa.onclick = function () { var t = reportText(); if (t) location.href = 'https://wa.me/?text=' + encodeURIComponent(t); };
    });
  }

  // settings
  function openSettings() {
    openView(function (v, V) {
      vhead(v, 'Settings');
      var card = el('div', 'card set');
      function seg(lbl, key, opts) {
        var r = el('div', 'sr'); r.appendChild(el('span', 'l', lbl)); var s = el('div', 'seg');
        opts.forEach(function (o) {
          var b = el('button', prefs[key] === o[0] ? 'on' : '', o[1]); b.setAttribute('aria-pressed', prefs[key] === o[0] ? 'true' : 'false');
          b.onclick = function () { prefs[key] = o[0]; savePrefs(); draw(); }; s.appendChild(b);
        });
        r.appendChild(s); return r;
      }
      function draw() {
        card.textContent = '';
        card.appendChild(seg('Theme', 'theme', [['light', 'Light'], ['dark', 'Dark'], ['auto', 'Auto']]));
        card.appendChild(seg('Text size', 'size', [['S', 'S'], ['M', 'M'], ['L', 'L']]));
        var r = el('div', 'sr'); var l = el('span', 'l', 'PASS / FAIL notifications'); l.appendChild(el('small', null, pushSupported() ? 'One alert per vehicle' : 'Not available on this phone / browser')); r.appendChild(l);
        var t = el('button', 'tog' + (alertsOn() ? ' on' : '')); t.setAttribute('aria-label', 'PASS / FAIL notifications'); t.setAttribute('aria-pressed', alertsOn() ? 'true' : 'false');
        t.disabled = !pushSupported();
        t.onclick = function () { toggleAlerts().then(draw); };
        r.appendChild(t); card.appendChild(r);
      }
      draw(); v.appendChild(card);
      v.appendChild(el('div', 'ver', 'ATS Live · ' + VERSION));
    });
  }

  // ---------- PASS / FAIL alerts (Web Push) ----------
  function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function alertsOn() { return pushSupported() && localStorage.getItem(PUSH_KEY) === '1' && Notification.permission === 'granted'; }
  function renderBell() {
    var vapid = S.data && S.data.vapid;
    ui.nudge.hidden = !(pushSupported() && vapid && !alertsOn() && Notification.permission !== 'denied' && !localStorage.getItem('atsLive.nudged'));
  }
  function b64ToBytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '==='.slice((s.length + 3) % 4); var bin = atob(s), o = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i); return o; }
  function sendSub(sub, on) { return api({ on: on ? '1' : '0', sub: JSON.stringify(sub) }); }
  function toggleAlerts(forceOn) {
    if (!pushSupported()) { toast('This phone / browser cannot show alerts'); return Promise.resolve(); }
    if (/iphone|ipad/i.test(navigator.userAgent) && !window.navigator.standalone) { toast('iPhone: Add to Home Screen first, then open the app from its icon', 3500); return Promise.resolve(); }
    return navigator.serviceWorker.ready.then(function (reg) {
      return reg.pushManager.getSubscription().then(function (cur) {
        if (alertsOn() && cur && !forceOn) {
          return sendSub(cur.toJSON(), false).catch(function () {}).then(function () { return cur.unsubscribe(); }).then(function () { localStorage.removeItem(PUSH_KEY); renderBell(); toast('Alerts off'); });
        }
        var vapid = S.data && S.data.vapid;
        if (!vapid) { toast('Alerts are not switched on in the office yet', 3500); return; }
        return Notification.requestPermission().then(function (p) {
          if (p !== 'granted') { toast('Notifications are blocked. Allow them in phone settings.', 3500); return; }
          return (cur ? cur.unsubscribe() : Promise.resolve())
            .then(function () { return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(vapid) }); })
            .then(function (sub) { return sendSub(sub.toJSON(), true); })
            .then(function () { localStorage.setItem(PUSH_KEY, '1'); localStorage.setItem('atsLive.vapid', vapid); renderBell(); toast('Alerts on · PASS / FAIL will come here'); });
        });
      });
    }).catch(function (e) { toast('Could not change alerts: ' + (e && e.message || e), 3500); });
  }
  function checkKey() {
    var vapid = S.data && S.data.vapid;
    if (!vapid || !alertsOn() || localStorage.getItem('atsLive.vapid') === vapid) return;
    navigator.serviceWorker.ready.then(function (reg) {
      return reg.pushManager.getSubscription().then(function (c) { return c ? c.unsubscribe() : null; })
        .then(function () { return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(vapid) }); })
        .then(function (sub) { return sendSub(sub.toJSON(), true); }).then(function () { localStorage.setItem('atsLive.vapid', vapid); });
    }).catch(function () {});
  }

  // ---------- start ----------
  function start() {
    buildHome();
    var lastDay = localStorage.getItem(DATA_KEY + 'last'), c = lastDay && cached(lastDay);
    if (c && c.day) { S.today = c.today; S.cur = c.date; S.data = c; S.sig = JSON.stringify(c.day) + (c.last && c.last.at); }
    S.auto = true;
    renderDays(); renderStatus(); renderTab(); renderHome();
    load(false);
    clearInterval(timer); timer = setInterval(function () { if (!document.hidden) load(false); }, EVERY);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && cfg) load(false); });
  window.addEventListener('online', function () { if (cfg) load(false); });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.type === 'refresh' && cfg) load(true); });
  }
  loadPrefs();
  loadCfg();
  if (cfg) start(); else showSetup();
})();
